# ══════════════════════════════════════════════════════════
# Docker Compose - Orquestación de servicios
# ══════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  demo:
    build:
      context: .
      dockerfile: docker/demo/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - api

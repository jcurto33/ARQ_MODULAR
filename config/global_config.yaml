# ══════════════════════════════════════════════════════════
# Configuración global del proyecto
# ══════════════════════════════════════════════════════════

# ── Rutas relativas (desde la raíz del repositorio) ──────
paths:
  data_dir: data
  models_dir: data/models
  raw_dir: data/files/raw
  processed_dir: data/files/processed
  predictions_dir: data/files/predictions
  vector_db_dir: data/bbdd/vector

# ── Módulo: Iris Classifier ──────────────────────────────
iris_classifier:
  model_name: random_forest          # Modelo seleccionado tras experimentación
  model_params:
    n_estimators: 100
    max_depth: 5
    random_state: 42
  test_size: 0.2

# ── Módulo: IA Act Chatbot ───────────────────────────────
ia_act_chatbot:
  collection_name: ia_act_chunks
  chunk_size: 800
  chunk_overlap: 100
  top_k: 5
  system_prompt: >
    Eres un asistente experto en el Reglamento de Inteligencia Artificial
    de la Unión Europea (AI Act - Reglamento UE 2024/1689). Responde siempre
    en español, de forma clara y citando los artículos relevantes cuando sea
    posible. Si no encuentras la información en el contexto proporcionado,
    indícalo honestamente.
